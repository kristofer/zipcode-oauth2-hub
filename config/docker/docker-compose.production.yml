version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: zipcode-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql/init:/docker-entrypoint-initdb.d
    networks:
      - zipcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: zipcode-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - zipcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: zipcode-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.zipcode.rocks
      KC_HTTP_ENABLED: null
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "9202:8080"
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
      - ./config/keycloak/themes:/opt/keycloak/themes
    command: start --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zipcode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile.production
      args:
        VERSION: ${VERSION}
    container_name: zipcode-gateway
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: 9201
    ports:
      - "9201:9201"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zipcode-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9201/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  productivity-app1:
    build:
      context: .
      dockerfile: Dockerfile.portal
      args:
        PORTAL_PATH: examples/productivity-app1
        VERSION: ${VERSION}
    container_name: zipcode-portal-productivity-app1
    environment:
      # OAuth2/Keycloak Configuration
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-zipcodewilmington}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: https://${PORTAL_DOMAIN}/callback
      JWT_ISSUER: https://${AUTH_DOMAIN}/realms/${KEYCLOAK_REALM:-zipcodewilmington}

      # Application Configuration
      APP_PORT: 9204
      GATEWAY_URL: http://gateway:9201

      # Portal-specific settings
      INSTITUTION_NAME: ${INSTITUTION_NAME}
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "9204:9204"
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - zipcode-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9204/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  zipcode-network:
    driver: bridge
