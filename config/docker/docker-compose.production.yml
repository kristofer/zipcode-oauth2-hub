version: '3.8'

services:
  # Keycloak Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: zipcode-keycloak-prod
    restart: unless-stopped
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      
      # Hostname and SSL
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS}
      KC_PROXY: ${KC_PROXY}
      
      # Admin credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      
      # JVM Performance
      JAVA_OPTS: ${JAVA_OPTS}
      
    command: start --import-realm --optimized
    ports:
      - "127.0.0.53:9202:9202"  # Only bind to localhost
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_data:/opt/keycloak/data
      - /var/log/zipcode-oauth2:/var/log/keycloak
    networks:
      - zipcode-auth-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9202/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    container_name: zipcode-gateway-prod
    restart: unless-stopped
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - GATEWAY_HOST=${GATEWAY_HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - METRICS_PORT=${METRICS_PORT}
    ports:
      - "127.0.0.53:9201:9201"  # Only bind to localhost
    depends_on:
      - keycloak
    networks:
      - zipcode-auth-network
    volumes:
      - /var/log/zipcode-oauth2:/var/log/gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9201/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (if not using external)
  redis:
    image: redis:7-alpine
    container_name: zipcode-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "127.0.0.53:6379:6379"
    volumes:
      - redis_prod_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - zipcode-auth-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Example Application (Production)
  student-portal:
    build:
      context: .
      dockerfile: examples/productivity-app1/Dockerfile
    container_name: zipcode-portal-prod
    restart: unless-stopped
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - CLIENT_ID=${CLIENT_ID}
      - REDIRECT_URI=${REDIRECT_URI}
      - APP_PORT=${APP_PORT}
      - NODE_ENV=${NODE_ENV}
    ports:
      - "127.0.0.53:9203:9203"
    depends_on:
      - api-gateway
    networks:
      - zipcode-auth-network
    volumes:
      - /var/log/zipcode-oauth2:/var/log/portal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9203 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  keycloak_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  zipcode-auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16